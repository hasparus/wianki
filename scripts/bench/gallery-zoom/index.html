<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>gallery zoom bench</title>
<style>
  html, body { margin: 0; background: #efefef; overflow: hidden; }
  .scroller { position: fixed; inset: 0; overflow-y: auto; overflow-x: hidden; }
  .content { position: relative; width: 100%; transform-origin: 0 0; }
  .tile { position: absolute; left: 0; top: 0; transform-origin: 0 0; background: #d8d8d8; overflow: hidden; }
  .tile img { display: block; width: 100%; height: 100%; object-fit: cover; }
  canvas.gl { position: fixed; inset: 0; }
  .r3f-scroller { position: fixed; inset: 0; overflow-y: auto; overflow-x: hidden; }
</style>
</head>
<body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body>
</html>
